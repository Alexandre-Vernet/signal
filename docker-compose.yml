version: '3'
services:
  signal-app:
    image: alexv31/signal:app
    networks:
      - signal-network
    ports:
      - "3008:80"
      - "3009:443"

  signal-api:
    image: alexv31/signal:api
    depends_on:
      - signal-db
    environment:
      - spring.datasource.url=jdbc:postgresql://signal-db:5432/database
      - spring.datasource.username=user
      - spring.datasource.password=password
      - spring.jpa.hibernate.ddl-auto=update
      - spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
      - spring.flyway.locations=classpath:db/migration
      - spring.flyway.baseline-on-migrate=true
      - server.servlet.context-path=/api
      - allowed.origin=https://signal.alexandre-vernet.fr
      - security.jwt.secret-key=
      - security.jwt.expiration-time=3600000
      - security.jwt.refresh.expiration-time=604800000
      - logging.level.org.springframework.security=INFO
      - server.port=80
      - server.address=0.0.0.0
    networks:
      - signal-network
    ports:
      - "4008:80"
      - "4009:443"

  signal-db:
    image: postgres:17
    restart: always
    networks:
      - signal-network
    environment:
      - POSTGRES_DB=database
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    ports:
      - "5008:5432"
      - "5009:443"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  signal-network:
    driver: bridge
